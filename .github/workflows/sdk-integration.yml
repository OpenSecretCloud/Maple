name: SDK OpenSecret integration CI

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sdk-integration.yml"
      - "sdk/opensecret-integration-revision"
      - "sdk/src/**"
      - "sdk/rust/**"
      - "sdk/test/**"
      - "sdk/.npmrc"
      - "sdk/bun.lock"
      - "sdk/bunfig.toml"
      - "sdk/package.json"
      - "sdk/rust-toolchain.toml"
      - "sdk/flake.nix"
      - "sdk/flake.lock"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/sdk-integration.yml"
      - "sdk/opensecret-integration-revision"
      - "sdk/src/**"
      - "sdk/rust/**"
      - "sdk/test/**"
      - "sdk/.npmrc"
      - "sdk/bun.lock"
      - "sdk/bunfig.toml"
      - "sdk/package.json"
      - "sdk/rust-toolchain.toml"
      - "sdk/flake.nix"
      - "sdk/flake.lock"

env:
  APP_MODE: local
  DATABASE_URL: postgres://opensecret_user:password@127.0.0.1:5432/opensecret
  ENCLAVE_SECRET_MOCK: "1111111111111111111111111111111111111111111111111111111111111111"
  JWT_SECRET: "2222222222222222222222222222222222222222222222222222222222222222"
  OPENAI_API_BASE: http://127.0.0.1:9
  OPENSECRET_BIND_ADDR: 127.0.0.1:3000
  OPENSECRET_DEV_CONTAINERS: "0"
  OPENSECRET_DEV_DATABASE_URL: postgres://opensecret_user:password@127.0.0.1:5432/opensecret
  OPENSECRET_DEV_ENV: "0"
  OPENSECRET_DEV_POSTGRES: "0"
  RUST_LOG: opensecret=info
  TINFOIL_API_KEY: sdk-integration-placeholder
  VITE_OPEN_SECRET_API_URL: http://127.0.0.1:3000
  VITE_OPEN_SECRET_ATTESTATION_ENVIRONMENT: dev
  VITE_TEST_CLIENT_ID: ba5a14b5-d915-47b1-b7b1-afda52bc5fc6
  VITE_TEST_DEVELOPER_EMAIL: sdk-ci-developer@local.test
  VITE_TEST_DEVELOPER_INVITE_CODE: 11111111-1111-4111-8111-111111111111
  VITE_TEST_DEVELOPER_NAME: SDK CI Developer
  VITE_TEST_DEVELOPER_PASSWORD: Maple-sdk-ci-test-1234
  VITE_TEST_EMAIL: sdk-ci-user@local.test
  VITE_TEST_NAME: SDK CI User
  VITE_TEST_PASSWORD: Maple-sdk-ci-test-1234

jobs:
  sdk-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opensecret
          POSTGRES_PASSWORD: password
          POSTGRES_USER: opensecret_user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opensecret_user -d opensecret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout Maple and SDK
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          persist-credentials: false

      - name: Read the pinned OpenSecret revision
        id: opensecret-revision
        run: |
          revision="$(tr -d '\r\n' < sdk/opensecret-integration-revision)"
          if [[ ! "${revision}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sdk/opensecret-integration-revision must contain one full commit SHA." >&2
            exit 1
          fi
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Checkout the pinned OpenSecret backend
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          repository: OpenSecretCloud/opensecret
          ref: ${{ steps.opensecret-revision.outputs.revision }}
          path: .ci/opensecret
          submodules: recursive
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # was v22
        with:
          github-token: ""

      - name: Migrate the disposable database and build OpenSecret
        run: |
          nix develop --no-update-lock-file ./.ci/opensecret -c bash -lc '
            cd .ci/opensecret
            diesel migration run
            cargo build --locked
          '
          nix develop --no-update-lock-file ./.ci/opensecret -c \
            psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 \
            -f sdk/test/integration/bootstrap.sql

      - name: Start and verify OpenSecret
        run: |
          nix develop --no-update-lock-file ./.ci/opensecret -c \
            .ci/opensecret/target/debug/opensecret \
            > "${RUNNER_TEMP}/opensecret.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/opensecret.pid"

          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 \
              "${VITE_OPEN_SECRET_API_URL}/health-check" >/dev/null; then
              echo "OpenSecret is ready."
              exit 0
            fi
            if ! kill -0 "$(cat "${RUNNER_TEMP}/opensecret.pid")" 2>/dev/null; then
              echo "OpenSecret exited before becoming ready." >&2
              tail -n 200 "${RUNNER_TEMP}/opensecret.log" >&2
              exit 1
            fi
            sleep 2
          done

          echo "OpenSecret did not become ready." >&2
          tail -n 200 "${RUNNER_TEMP}/opensecret.log" >&2
          exit 1

      - name: Run TypeScript SDK integration tests
        run: |
          nix develop --no-update-lock-file ./sdk -c bash -lc '
            set -euo pipefail
            cd sdk
            bun install --frozen-lockfile --ignore-scripts
            bun test src/lib/test/integration/api.test.ts --timeout 30000
            bun test src/lib/test/integration/ai.test.ts --timeout 30000
            bun test src/lib/test/integration/apiKeys.test.ts --timeout 30000
            bun test src/lib/test/integration/bip85.test.ts --timeout 30000
            bun test src/lib/test/integration/developer.test.ts --timeout 30000
            bun test src/lib/test/integration/signing.test.ts --timeout 30000
          '

      - name: Run Rust SDK integration tests
        run: |
          nix develop --no-update-lock-file ./sdk -c bash -lc '
            cd sdk/rust
            cargo test --locked --all-features --tests
          '

      - name: Show OpenSecret log on failure
        if: ${{ failure() }}
        run: tail -n 300 "${RUNNER_TEMP}/opensecret.log" || true

      - name: Stop OpenSecret
        if: ${{ always() }}
        run: |
          if [[ -f "${RUNNER_TEMP}/opensecret.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/opensecret.pid")" 2>/dev/null || true
          fi
