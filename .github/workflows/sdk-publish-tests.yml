name: SDK publishing boundary tests

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/sdk-publish-*.yml"
      - "scripts/ci/sdk_publish.py"
      - "scripts/ci/sdk_crates_upload.py"
      - "scripts/ci/build-sdk-publish.sh"
      - "scripts/ci/check-sdk-package-consumers.py"
      - "scripts/ci/test_sdk_publish*.py"
      - "scripts/ci/test_sdk_crates_upload.py"
      - "sdk/src/**"
      - "sdk/rust/**"
      - "sdk/package.json"
      - "sdk/bun.lock"
      - "sdk/bunfig.toml"
      - "sdk/tsconfig*.json"
      - "sdk/vite.config.ts"
      - "sdk/rust-toolchain.toml"
      - "sdk/flake.nix"
      - "sdk/flake.lock"
      - "flake.nix"
      - "flake.lock"
  push:
    branches: [master]
    paths:
      - ".github/workflows/sdk-publish-*.yml"
      - "scripts/ci/sdk_publish.py"
      - "scripts/ci/sdk_crates_upload.py"
      - "scripts/ci/build-sdk-publish.sh"
      - "scripts/ci/check-sdk-package-consumers.py"
      - "scripts/ci/test_sdk_publish*.py"
      - "scripts/ci/test_sdk_crates_upload.py"
      - "sdk/src/**"
      - "sdk/rust/**"
      - "sdk/package.json"
      - "sdk/bun.lock"
      - "sdk/bunfig.toml"
      - "sdk/tsconfig*.json"
      - "sdk/vite.config.ts"
      - "sdk/rust-toolchain.toml"
      - "sdk/flake.nix"
      - "sdk/flake.lock"
      - "flake.nix"
      - "flake.lock"

jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          github-token: ""

      - name: Test publication security boundaries without credentials
        run: nix build --no-update-lock-file --no-link --print-build-logs .#checks.x86_64-linux.sdk-publishing

  packages:
    name: SDK package (${{ matrix.kind }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        kind: [npm, rust]
    env:
      SDK_KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          github-token: ""

      - name: Exercise the real package builder without publishing credentials
        run: bash scripts/ci/build-sdk-publish.sh "$SDK_KIND" "$RUNNER_TEMP/sdk-package"

      - name: Validate Rust upload metadata without credentials or a network request
        if: ${{ matrix.kind == 'rust' }}
        run: |
          set -euo pipefail
          SDK_VERSION=$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("sdk/rust/Cargo.toml").read_text())["package"]["version"])')
          python3 -I scripts/ci/sdk_crates_upload.py --directory "$RUNNER_TEMP/sdk-package" \
            --version "$SDK_VERSION" --validate-only
