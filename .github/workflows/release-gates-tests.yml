name: Release gates tests

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-gates-tests.yml"
      - ".github/workflows/proxy-rust.yml"
      - ".github/workflows/proxy-publish.yml"
      - ".github/workflows/zapstore-publish.yml"
      - "scripts/ci/classify-app-release.sh"
      - "scripts/ci/proxy-release.sh"
      - "scripts/ci/plan-proxy-container-publish.sh"
      - "scripts/ci/proxy_registry_inventory.py"
      - "scripts/ci/test_proxy_registry_inventory.py"
      - "scripts/ci/inspect-proxy-container-manifest.sh"
      - "scripts/ci/test-plan-proxy-container-publish.sh"
      - "scripts/ci/test-proxy-release-artifacts.sh"
      - "scripts/ci/test-release-gates.sh"
      - "scripts/ci/test-windows-runtime-manifest.sh"
      - "scripts/ci/validate-release-version.sh"
      - "scripts/ci/verify-release-artifacts.sh"
      - "proxy/Cargo.toml"
      - "proxy/Cargo.lock"
      - "proxy/justfile"
      - "proxy/src/**"
      - "apps/maple-research/frontend/package.json"
      - "apps/maple-research/frontend/src-tauri/Cargo.toml"
      - "apps/maple-research/frontend/src-tauri/tauri.conf.json"
      - "flake.nix"
      - "flake.lock"
  push:
    branches: [master]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-gates-tests.yml"
      - ".github/workflows/proxy-rust.yml"
      - ".github/workflows/proxy-publish.yml"
      - ".github/workflows/zapstore-publish.yml"
      - "scripts/ci/classify-app-release.sh"
      - "scripts/ci/proxy-release.sh"
      - "scripts/ci/plan-proxy-container-publish.sh"
      - "scripts/ci/proxy_registry_inventory.py"
      - "scripts/ci/test_proxy_registry_inventory.py"
      - "scripts/ci/inspect-proxy-container-manifest.sh"
      - "scripts/ci/test-plan-proxy-container-publish.sh"
      - "scripts/ci/test-proxy-release-artifacts.sh"
      - "scripts/ci/test-release-gates.sh"
      - "scripts/ci/test-windows-runtime-manifest.sh"
      - "scripts/ci/validate-release-version.sh"
      - "scripts/ci/verify-release-artifacts.sh"
      - "proxy/Cargo.toml"
      - "proxy/Cargo.lock"
      - "proxy/justfile"
      - "proxy/src/**"
      - "apps/maple-research/frontend/package.json"
      - "apps/maple-research/frontend/src-tauri/Cargo.toml"
      - "apps/maple-research/frontend/src-tauri/tauri.conf.json"
      - "flake.nix"
      - "flake.lock"

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # was v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          source-tag: v3.23.3
          github-token: ""

      - name: Verify pinned Nix runtime
        run: bash scripts/ci/verify-nix-runtime.sh

      - name: Test release gates
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.release-gates
