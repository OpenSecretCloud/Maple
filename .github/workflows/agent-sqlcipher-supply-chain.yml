name: Agent SQLCipher source verification

on:
  pull_request:
    paths:
      - apps/maple-agent/Cargo.lock
      - apps/maple-agent/flake.nix
      - apps/maple-agent/flake.lock
      - apps/maple-agent/dependencies/sqlcipher/**
      - apps/maple-agent/dependencies/licenses/**
      - apps/maple-agent/about.toml
      - apps/maple-agent/scripts/*third*party*notices*
      - apps/maple-agent/app/assets/dict/LICENSE
      - apps/maple-agent/crates/maple-agent/src/store/keys/SOURCES.md
      - apps/maple-agent/crates/maple-agent/src/store/keys/eff-large-wordlist.txt
      - apps/maple-agent/Cargo.toml
      - apps/maple-agent/**/Cargo.toml
      - apps/maple-agent/scripts/verify-sqlcipher-build.py
      - apps/maple-agent/scripts/test-rusqlite-provider.py
      - apps/maple-agent/scripts/audit-sqlcipher-dependencies.py
      - .github/workflows/agent-sqlcipher-supply-chain.yml
  push:
    branches: [master]
    paths:
      - apps/maple-agent/Cargo.lock
      - apps/maple-agent/flake.nix
      - apps/maple-agent/flake.lock
      - apps/maple-agent/dependencies/sqlcipher/**
      - apps/maple-agent/dependencies/licenses/**
      - apps/maple-agent/about.toml
      - apps/maple-agent/scripts/*third*party*notices*
      - apps/maple-agent/app/assets/dict/LICENSE
      - apps/maple-agent/crates/maple-agent/src/store/keys/SOURCES.md
      - apps/maple-agent/crates/maple-agent/src/store/keys/eff-large-wordlist.txt
      - apps/maple-agent/Cargo.toml
      - apps/maple-agent/**/Cargo.toml
      - apps/maple-agent/scripts/verify-sqlcipher-build.py
      - apps/maple-agent/scripts/test-rusqlite-provider.py
      - apps/maple-agent/scripts/audit-sqlcipher-dependencies.py
      - .github/workflows/agent-sqlcipher-supply-chain.yml
  schedule:
    - cron: '28 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-sqlcipher-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/maple-agent
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28
        with:
          source-tag: v3.23.3
          github-token: ""
      - name: Verify pinned Nix runtime
        working-directory: .
        run: bash scripts/ci/verify-nix-runtime.sh
      - name: Test provider source selection
        run: >-
          nix develop --no-update-lock-file . -c python3 -m unittest
          discover -s dependencies/sqlcipher -p 'test_*.py'
      - name: Fetch the pinned Git and registry sources and check their hashes
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/maple-sqlcipher-metadata.json"
          # shellcheck disable=SC2016 # The child shell expands its own positional argument.
          nix develop --no-update-lock-file . -c bash -c 'cargo metadata --locked --format-version 1 > "$1"' -- "$metadata"
          nix develop --no-update-lock-file . -c python3 dependencies/sqlcipher/verify_sources.py --metadata "$metadata"
      - name: Verify the signed tag and regenerate the SQLCipher amalgamation
        run: >-
          nix develop --no-update-lock-file . -c python3
          dependencies/sqlcipher/verify_sqlcipher.py
          --metadata "$RUNNER_TEMP/maple-sqlcipher-metadata.json"
      - name: Audit supported-target dependency graphs
        run: nix develop --no-update-lock-file . -c python3 scripts/audit-sqlcipher-dependencies.py
      - name: Generate and validate Linux third-party notices
        run: |
          nix develop --no-update-lock-file . -c python3 scripts/generate-third-party-notices.py
          nix develop --no-update-lock-file . -c python3 scripts/generate-third-party-notices.py --check
