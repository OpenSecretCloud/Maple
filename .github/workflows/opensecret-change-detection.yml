name: Select OpenSecret checks

on:
  workflow_call:
    outputs:
      rust:
        description: Whether backend Rust checks are needed
        value: ${{ jobs.detect.outputs.rust }}
      nix:
        description: Whether backend Nix checks are needed
        value: ${{ jobs.detect.outputs.nix }}
      integration:
        description: Whether SDK and backend compatibility checks are needed
        value: ${{ jobs.detect.outputs.integration }}
      audit:
        description: Whether backend dependency auditing is needed
        value: ${{ jobs.detect.outputs.audit }}
      pcr:
        description: Whether signed PCR compatibility checks are needed
        value: ${{ jobs.detect.outputs.pcr }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      nix: ${{ steps.classify.outputs.nix }}
      integration: ${{ steps.classify.outputs.integration }}
      audit: ${{ steps.classify.outputs.audit }}
      pcr: ${{ steps.classify.outputs.pcr }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          enable_all() {
            for output in rust nix integration audit pcr; do
              printf '%s=true\n' "$output" >> "$GITHUB_OUTPUT"
            done
          }
          case "$GITHUB_EVENT_NAME" in
            pull_request) separator='...' ;;
            push)
              separator='..'
              if [[ "$BASE_SHA" =~ ^0+$ ]]; then
                enable_all
                exit 0
              fi
              ;;
            schedule)
              # Scheduled advisories change independently of repository files.
              printf 'rust=false\nnix=false\nintegration=false\naudit=true\npcr=false\n' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *) enable_all; exit 0 ;;
          esac
          if ! git cat-file -e "${BASE_SHA}^{commit}" || ! git cat-file -e "${HEAD_SHA}^{commit}"; then
            enable_all
            exit 0
          fi
          changed_paths="$(mktemp)"
          trap 'rm -f "$changed_paths"' EXIT
          if ! git diff --no-renames --name-only -z "${BASE_SHA}${separator}${HEAD_SHA}" > "$changed_paths"; then
            enable_all
          elif ! python3 scripts/ci/opensecret_change_detection.py < "$changed_paths" >> "$GITHUB_OUTPUT"; then
            enable_all
          fi
