  "MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib",
  "Unicode-3.0", "CDLA-Permissive-2.0", "CC0-1.0", "Unlicense", "BSL-1.0",
  "MIT-0", "Apache-2.0 WITH LLVM-exception", "MPL-2.0", "bzip2-1.0.6",
  "blessing", "WTFPL", "NCSA", "GPL-3.0-or-later", "OFL-1.1",
]
# The generator selects the exact native package target, not a union of platforms.
ignore-dev-dependencies = true
ignore-build-dependencies = false

