[package]
name = "pi-ai"
description = "Provider-neutral model messages, streaming events and an OpenAI-compatible provider, after Pi's pi-ai package"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["reqwest"]
# An HTTP transport for the OpenAI-compatible provider. Hosts with their own
# transport (an in-process proxy, a test server) can turn it off.
reqwest = ["dep:reqwest"]

[dependencies]
serde = { workspace = true }
# The server's key order stays in error messages, as JSON.stringify keeps it in Pi.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
bytes = "1"
indexmap = { version = "2", features = ["serde"] }
jsonschema = { version = "0.55", default-features = false }
regex = "1"
reqwest = { workspace = true, optional = true }
