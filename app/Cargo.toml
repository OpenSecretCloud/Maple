[package]
name = "maple-gpui"
description = "Native Maple desktop app (gpui frontend over the maple-agent runtime)"
edition = "2024"
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "maple-gpui"
path = "src/main.rs"

[dependencies]
maple-agent = { path = "../crates/maple-agent" }
maple-billing = { path = "../crates/maple-billing" }
gpui = { version = "0.2.2", features = ["test-support"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
webbrowser = "1"
opensecret = "3.6.2"
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"

[dev-dependencies]
parking_lot = "0.12"
