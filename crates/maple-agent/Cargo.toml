[package]
name = "maple-agent"
description = "Transport-neutral Maple agent runtime: Goose-backed sessions, provider, tools, permissions"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["acp"]
# The Agent Client Protocol server (`maple_agent::acp`).
acp = ["dep:agent-client-protocol"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
once_cell = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
goose = { git = "https://github.com/benthecarman/goose.git", rev = "3f7cc605aa2ce9620daace75b5f5e58ce57eef3d", package = "goose", default-features = false }
goose-providers = { git = "https://github.com/benthecarman/goose.git", rev = "3f7cc605aa2ce9620daace75b5f5e58ce57eef3d", package = "goose-providers", default-features = false }
opensecret = "3.6.2"
maple-proxy = "0.3.2"
rand = "0.8.6"
rmcp = { version = "=3.1.2", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
httpdate = "1"
process-wrap = { version = "=9.1.0", default-features = false, features = ["tokio1", "creation-flags", "job-object", "process-group"] }
pulldown-cmark = { version = "0.13", default-features = false }
tempfile = "3"
icu_properties = "2.1.1"
sha2 = "0.10"
agent-client-protocol = { version = "=2.0.0", optional = true, default-features = false, features = ["unstable_elicitation", "unstable_end_turn_token_usage"] }
base64 = "0.22"
bytes = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.8"
ciborium = "0.2"
